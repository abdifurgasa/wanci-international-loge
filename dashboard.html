<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wonchi International Lodge Dashboard</title>

<link rel="stylesheet" href="css/dashboard.css">

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  display: flex;
  height: 100vh;
}

/* Sidebar */
.sidebar {
  width: 230px;
  background: #1e2a38;
  color: white;
  padding-top: 20px;
  display: flex;
  flex-direction: column;
}

.sidebar h2 {
  text-align: center;
  margin-bottom: 20px;
}

.sidebar ul {
  list-style: none;
  padding: 0;
}

.sidebar a {
  display: block;
  color: white;
  padding: 12px 20px;
  text-decoration: none;
}

.sidebar a:hover {
  background: #2c7be5;
}

/* Main */
.main {
  flex: 1;
  background: #f4f6f9;
  padding: 20px;
}

.header {
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.cards {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
  gap: 20px;
  margin-top: 20px;
}

.card {
  background: white;
  padding: 20px;
  border-radius: 8px;
  box-shadow: 0 3px 10px rgba(0, 0, 0, 0.2);
  text-align: center;
}

.card h3 {
  margin: 10px 0;
}

.language {
  margin-right: 10px;
}

.logout {
  background: red;
  color: white;
  border: none;
  padding: 8px 12px;
  cursor: pointer;
  border-radius: 6px;
}
</style>
</head>

<body>

<!-- Sidebar -->
<div class="sidebar">
  <h2 data-lang="hotel_name">Wonchi International Lodge</h2>
  <ul id="sidebarMenu"></ul>
</div>

<!-- Main Content -->
<div class="main">
  <div class="header">
    <h1 data-lang="dashboard">Dashboard</h1>
    <div>
      <select class="language" onchange="changeLanguage(this.value)">
        <option value="English">English</option>
        <option value="amharic">አማርኛ</option>
        <option value="afan-oromo">Afan Oromo</option>
      </select>
      <button id="logoutBtn" class="logout">Logout</button>
    </div>
  </div>

  <!-- Dashboard Cards -->
  <div class="cards">
    <div class="card">
      <h3 data-lang="rooms">Rooms</h3>
      <p>Manage hotel rooms</p>
    </div>

    <div class="card">
      <h3 data-lang="booking">Bookings</h3>
      <p>Guest reservations</p>
    </div>

    <div class="card">
      <h3 data-lang="restaurant">Restaurant</h3>
      <p>Food orders</p>
    </div>

    <div class="card">
      <h3 data-lang="finance">Finance</h3>
      <p>Revenue & reports</p>
    </div>
  </div>
</div>

<script>
// Language system
async function changeLanguage(lang) {
  try {
    let file = "";
    if (lang === "English") file = "language/English/en.json";
    if (lang === "amharic") file = "language/amharic/am.json";
    if (lang === "afan-oromo") file = "language/afan-oromo/or.json";

    const response = await fetch(file);
    const data = await response.json();

    document.querySelectorAll("[data-lang]").forEach(el => {
      el.innerText = data[el.dataset.lang];
    });

    localStorage.setItem("language", lang);
  } catch (e) {
    console.warn("Language load error", e);
  }
}

window.onload = function () {
  const savedLang = localStorage.getItem("language") || "English";
  changeLanguage(savedLang);
}
</script>

<script type="module" src="js/dashboard.js"></script>
</body>
</html>
